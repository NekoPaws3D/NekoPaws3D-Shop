<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Design-Assistent – NekoPaws3D</title><link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="css/enhancements.css"><link rel="stylesheet" href="css/customer-experience.css?v=1"></head><body><header class="header simple"><a class="brand" href="index.html"><img src="assets/logo.png" class="logo" alt="Logo"><div><h1>Neko<span>Paws</span>3D</h1><p>Design-Assistent</p></div></a><a class="outline-btn" href="index.html">Zurück zum Shop</a></header><main class="page"><h2>🎨 Dein Wunschmotiv Schritt für Schritt</h2><div class="cx-steps" id="wizard-steps"></div><form id="design-wizard">
<section class="cx-wizard-panel active" data-step="0"><h3>1. Grundlage</h3><label>Projektart<select name="project_type" required><option>Zeichnung</option><option>3D-Druck</option><option>Textildruck</option><option>Sticker</option><option>Epoxidharz</option></select></label><label>Motiv / Figur<input name="motif" required maxlength="120"></label></section>
<section class="cx-wizard-panel" data-step="1"><h3>2. Stil & Wirkung</h3><label>Stil<select name="style"><option>Chibi</option><option>Anime / Manga</option><option>Cartoon</option><option>Fantasy</option><option>Realistisch</option><option>Minimalistisch</option><option>Nach Absprache</option></select></label><label>Stimmung<select name="mood"><option>Niedlich</option><option>Düster</option><option>Magisch</option><option>Fröhlich</option><option>Elegant</option><option>Actionreich</option></select></label></section>
<section class="cx-wizard-panel" data-step="2"><h3>3. Farben & Details</h3><label>Hauptfarben<input name="colors" placeholder="z. B. Schwarz, Pink, Violett"></label><label>Pose / Anordnung<textarea name="pose" rows="4"></textarea></label><label>Hintergrund<textarea name="background" rows="3"></textarea></label></section>
<section class="cx-wizard-panel" data-step="3"><h3>4. Rahmen</h3><label>Budget (€)<input name="budget" type="number" min="0"></label><label>Wunschtermin<input name="date" type="date"></label><label>Verwendungszweck<select name="usage"><option>Privat</option><option>Geschenk</option><option>Social Media</option><option>Gewerblich</option></select></label></section>
<section class="cx-wizard-panel" data-step="4"><h3>5. Kontakt & Zusammenfassung</h3><label>Name<input name="name" required></label><label>E-Mail<input name="email" type="email" required></label><label>Weitere Wünsche<textarea name="notes" rows="5"></textarea></label><pre id="design-summary" class="cx-summary"></pre><p class="muted">Nach dem Abschluss wirst du mit der ausgefüllten Zusammenfassung zur bestehenden Zeichenauftragsseite weitergeleitet.</p></section>
<div><button class="outline-btn" id="wizard-back" type="button">Zurück</button><button class="main-btn" id="wizard-next" type="button">Weiter</button><button class="main-btn hidden" id="wizard-finish" type="submit">Anfrage vorbereiten</button></div></form></main><script src="js/design-assistant.js"></script></body></html>
